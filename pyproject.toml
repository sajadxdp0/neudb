[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neudb"
dynamic = ["version"]
description = "Inspectable embedded Python storage with atomic JSON tables, text search, and vector search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Abdulla Sajad" }]
maintainers = [{ name = "Abdulla Sajad" }]
keywords = [
    "database",
    "embedded-database",
    "json",
    "persistence",
    "vector-search",
    "semantic-search",
    "ai-memory",
    "llm",
    "python",
    "zero-dependency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "pydantic>=2.7,<3.0", "uvicorn[standard]>=0.30,<1.0"]
agent = ["sentence-transformers>=3.0,<6.0"]
embeddings = ["sentence-transformers>=3.0,<6.0"]
test = ["fastapi>=0.115,<1.0", "httpx>=0.27,<1.0", "pydantic>=2.7,<3.0", "pytest>=8.0,<10.0"]
dev = [
    "build>=1.2,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<3.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.urls]
Homepage = "https://sajadxdp0.github.io/neudb/"
Documentation = "https://github.com/sajadxdp0/neudb#readme"
Repository = "https://github.com/sajadxdp0/neudb"
Changelog = "https://github.com/sajadxdp0/neudb/blob/main/CHANGELOG.md"
Issues = "https://github.com/sajadxdp0/neudb/issues"
Security = "https://github.com/sajadxdp0/neudb/security/policy"

[project.scripts]
neudb = "neudb:main"
neudb-agent = "neudb.agent:main"

[tool.setuptools]
packages = ["neudb"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "neudb._version.__version__" }

[tool.setuptools.package-data]
neudb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["neudb", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["neudb"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true
